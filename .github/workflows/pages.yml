# Serve the repository as-is on GitHub Pages (no Jekyll, no build step).

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate data files
        run: |
          python - <<'PY'
          import json, pathlib, sys
          required = ["summary.json", "at.json", "delta.json", "archived.json"]
          ok = True
          for name in required:
              p = pathlib.Path("data") / name
              if not p.exists():
                  print(f"missing: {p}"); ok = False; continue
              try:
                  payload = json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"invalid JSON in {p}: {exc}"); ok = False; continue
              print(f"{p}: ok ({p.stat().st_size/1e6:.2f} MB)")
          sys.exit(0 if ok else 1)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # 首次运行时自动开启 Pages（Sources 设为 GitHub Actions）

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
